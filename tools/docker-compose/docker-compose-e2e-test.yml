version: '3.6'
services:
  # The e2e test reaches every service by its name on the compose network.
  # A fixed host port only adds a bind conflict with other processes on the
  # host, so reset the port mappings that the other compose files declare.
  mysql:
    ports: !reset []
  localstack:
    ports: !reset []
  write-api-server-1:
    ports: !reset []
  read-model-updater-1:
    ports: !reset []
  read-api-server-1:
    ports: !reset []
  # The e2e script does not start the two admin UIs. Resetting them keeps the
  # merged configuration free of host ports whatever services are started.
  phpmyadmin:
    ports: !reset []
  dynamodb-admin:
    ports: !reset []
  e2e-test:
    image: e2e-test-java:latest
    environment:
      WRITE_API_SERVER_BASE_URL: http://write-api-server-1:8080/graphql
      READ_API_SERVER_BASE_URL: http://read-api-server-1:8080/graphql
    depends_on:
      write-api-server-1:
        condition: service_started
      read-api-server-1:
        condition: service_started
