name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # A base change arrives as edited even when the head SHA stays the same.
    # Run all checks on metadata edits too, so they never publish a skipped gate.
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '0 * * * *'
jobs:
  lint:
    runs-on: ubuntu-latest
    name: "Run lint"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: spotlessCheck --info
  deploy-assets:
    runs-on: ubuntu-latest
    needs: lint
    name: "Validate deployment assets"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install cfn-lint
      - run: cfn-lint deploy/rmu-deployment.template.json
      - run: |
          bash -n deploy/apply-rmu-deployment.sh
          bash -n deploy/build-lambda-package.sh
          bash -n deploy/report-lambda-package-size.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: :rmu:lambdaZip --console=plain
      - run: |
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/java/rmu/ReadModelUpdater.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/java/rmu/RecoveryWorker.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/java/rmu/ResyncWorker.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'lib/aws-lambda-java-events'
      - name: Report Lambda package size
        run: deploy/report-lambda-package-size.sh rmu/build/distributions/rmu-lambda.zip
  test-jdk-17:
    runs-on: ubuntu-latest
    needs: lint
    env: &test-env
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    name: "Run tests with JDK 17"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: test --info
  test-jdk-25:
    runs-on: ubuntu-latest
    needs: lint
    env: *test-env
    name: "Run tests with JDK 25"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: test --info
  e2e:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: |
          docker buildx create --name amd-arm --driver docker-container --platform linux/amd64
          cd ./tools/e2e-test && make build && cd ../../
          ./tools/scripts/docker-build.sh
          ./tools/scripts/docker-compose-e2e-test.sh
  aislop:
    runs-on: ubuntu-latest
    name: "Run aislop"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check:aislop
      - run: npm run test:aislop
  required-ci:
    name: Required product CI
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [lint, deploy-assets, test-jdk-17, test-jdk-25, e2e, aislop]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every product CI job to succeed
        env:
          LINT: ${{ needs.lint.result }}
          DEPLOY_ASSETS: ${{ needs.deploy-assets.result }}
          TEST_JDK_17: ${{ needs.test-jdk-17.result }}
          TEST_JDK_25: ${{ needs.test-jdk-25.result }}
          E2E: ${{ needs.e2e.result }}
          AISLOP: ${{ needs.aislop.result }}
        run: |
          failed=0
          for job in LINT DEPLOY_ASSETS TEST_JDK_17 TEST_JDK_25 E2E AISLOP; do
            result=${!job}
            printf '%s: %s\n' "$job" "${result:-missing}"
            if [[ "$result" != success ]]; then
              failed=1
            fi
          done
          [[ "$failed" == 0 ]]
      - name: Reject a cancelled workflow
        if: ${{ cancelled() }}
        run: exit 1
