name: CI fixture
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
jobs:
  lint:
    name: "Run lint"
    runs-on: ubuntu-latest
    steps:
      - run: true
  deploy-assets:
    name: "Validate deployment assets"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - run: true
  test-jdk-17:
    name: "Run tests with JDK 17"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - run: true
  test-jdk-25:
    name: "Run tests with JDK 25"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - run: sleep 180
  e2e:
    name: "e2e"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - run: true
  aislop:
    name: "Run aislop"
    runs-on: ubuntu-latest
    steps:
      - run: true
  required-ci:
    name: Required product CI
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [lint, deploy-assets, test-jdk-17, test-jdk-25, e2e, aislop]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every product CI job to succeed
        env:
          LINT: ${{ needs.lint.result }}
          DEPLOY_ASSETS: ${{ needs.deploy-assets.result }}
          TEST_JDK_17: ${{ needs.test-jdk-17.result }}
          TEST_JDK_25: ${{ needs.test-jdk-25.result }}
          E2E: ${{ needs.e2e.result }}
          AISLOP: ${{ needs.aislop.result }}
        run: |
          failed=0
          for job in LINT DEPLOY_ASSETS TEST_JDK_17 TEST_JDK_25 E2E AISLOP; do
            result=${!job}
            printf '%s: %s\n' "$job" "${result:-missing}"
            if [[ "$result" != success ]]; then
              failed=1
            fi
          done
          [[ "$failed" == 0 ]]
      - name: Reject a cancelled workflow
        if: ${{ cancelled() }}
        run: exit 1
