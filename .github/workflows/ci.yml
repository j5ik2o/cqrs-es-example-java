name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # A base change arrives as edited even when the head SHA stays the same.
    # Run all checks on metadata edits too, so they never publish a skipped gate.
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: '0 * * * *'
jobs:
  checkout-revision:
    name: Resolve the PR test merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.resolve.outputs.checkout_ref }}
      test_merge: ${{ steps.resolve.outputs.test_merge }}
      bundle: ${{ steps.resolve.outputs.bundle_name }}
    steps:
      # Load the resolver from the revision that defines this workflow; a PR
      # branch that predates it does not have the script.
      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the test merge resolution
        if: ${{ github.event_name == 'pull_request' }}
        run: node --test .github/scripts/pr-test-merge.test.mjs
      # Check the current base tip and PR head, not the event's base SHA.
      - name: Resolve the PR's test merge
        id: resolve
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/pr-test-merge.sh
      - uses: actions/upload-artifact@v7
        if: ${{ steps.resolve.outputs.bundle_name != '' }}
        with:
          name: ${{ steps.resolve.outputs.bundle_name }}
          path: ${{ runner.temp }}/pr-test-merge.bundle
          if-no-files-found: error
          # After expiry, re-run all jobs so this job builds the bundle again.
          retention-days: 1
  lint:
    needs: checkout-revision
    runs-on: ubuntu-latest
    name: "Run lint"
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.checkout-revision.outputs.ref }}
          # The bundle of a locally built test merge needs the base history.
          fetch-depth: ${{ needs.checkout-revision.outputs.bundle != '' && '0' || '1' }}
          persist-credentials: false
      - &download-test-merge
        uses: actions/download-artifact@v7
        if: ${{ needs.checkout-revision.outputs.bundle != '' }}
        with:
          name: ${{ needs.checkout-revision.outputs.bundle }}
          path: ${{ runner.temp }}/pr-test-merge
      - &verify-test-merge
        name: Verify the checked out test merge
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          TEST_MERGE: ${{ needs.checkout-revision.outputs.test_merge }}
          BUNDLE: ${{ needs.checkout-revision.outputs.bundle }}
        run: |
          if [[ -n "$BUNDLE" ]]; then
            git fetch --quiet --no-tags "$RUNNER_TEMP/pr-test-merge/pr-test-merge.bundle" refs/pr-ci/merge
            git checkout --quiet --detach FETCH_HEAD
          fi
          # A shallow checkout hides parents from %P; the commit object keeps them.
          actual="$(git rev-parse HEAD)$(git cat-file commit HEAD | awk '!NF { exit } $1 == "parent" { printf " %s", $2 }')"
          printf 'Checked out test merge (SHA, base, head): %s\n' "$actual"
          if [[ -z "$TEST_MERGE" || "$actual" != "$TEST_MERGE" ]]; then
            printf '::error::Expected test merge %s\n' "${TEST_MERGE:-missing}"
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: spotlessCheck --info
  deploy-assets:
    runs-on: ubuntu-latest
    needs: [lint, checkout-revision]
    name: "Validate deployment assets"
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install cfn-lint
      - run: cfn-lint deploy/rmu-deployment.template.json
      - run: |
          bash -n deploy/apply-rmu-deployment.sh
          bash -n deploy/build-lambda-package.sh
          bash -n deploy/report-lambda-package-size.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: :rmu:lambdaZip --console=plain
      - run: |
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/java/rmu/ReadModelUpdater.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/java/rmu/RecoveryWorker.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/java/rmu/ResyncWorker.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'lib/aws-lambda-java-events'
      - name: Report Lambda package size
        run: deploy/report-lambda-package-size.sh rmu/build/distributions/rmu-lambda.zip
  test-jdk-17:
    runs-on: ubuntu-latest
    needs: [lint, checkout-revision]
    env: &test-env
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    name: "Run tests with JDK 17"
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: test --info
  test-jdk-25:
    runs-on: ubuntu-latest
    needs: [lint, checkout-revision]
    env: *test-env
    name: "Run tests with JDK 25"
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: test --info
  e2e:
    runs-on: ubuntu-latest
    needs: [lint, checkout-revision]
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: docker/setup-buildx-action@v4
      - run: |
          docker buildx create --name amd-arm --driver docker-container --platform linux/amd64
          cd ./tools/e2e-test && make build && cd ../../
          ./tools/scripts/docker-build.sh
          ./tools/scripts/docker-compose-e2e-test.sh
  aislop:
    needs: checkout-revision
    runs-on: ubuntu-latest
    name: "Run aislop"
    timeout-minutes: 15
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check:aislop
      - run: npm run test:aislop
  required-ci:
    name: Required product CI
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [checkout-revision, lint, deploy-assets, test-jdk-17, test-jdk-25, e2e, aislop]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require every product CI job to succeed
        env:
          LINT: ${{ needs.lint.result }}
          DEPLOY_ASSETS: ${{ needs.deploy-assets.result }}
          TEST_JDK_17: ${{ needs.test-jdk-17.result }}
          TEST_JDK_25: ${{ needs.test-jdk-25.result }}
          E2E: ${{ needs.e2e.result }}
          AISLOP: ${{ needs.aislop.result }}
          CHECKOUT_REVISION: ${{ needs.checkout-revision.result }}
        run: |
          failed=0
          for job in CHECKOUT_REVISION LINT DEPLOY_ASSETS TEST_JDK_17 TEST_JDK_25 E2E AISLOP; do
            result=${!job}
            printf '%s: %s\n' "$job" "${result:-missing}"
            if [[ "$result" != success ]]; then
              failed=1
            fi
          done
          [[ "$failed" == 0 ]]
      - name: Reject a cancelled workflow
        if: ${{ cancelled() }}
        run: exit 1
