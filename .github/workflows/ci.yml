name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'version'
  schedule:
    - cron: '0 * * * *'
jobs:
  lint:
    runs-on: ubuntu-latest
    name: "Run lint"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: spotlessCheck --info
  deploy-assets:
    runs-on: ubuntu-latest
    needs: lint
    name: "Validate deployment assets"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install cfn-lint
      - run: cfn-lint deploy/rmu-deployment.template.json
      - run: |
          bash -n deploy/apply-rmu-deployment.sh
          bash -n deploy/build-lambda-package.sh
          bash -n deploy/report-lambda-package-size.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: :rmu:lambdaZip --console=plain
      - run: |
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/java/rmu/ReadModelUpdater.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/java/rmu/RecoveryWorker.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'com/github/j5ik2o/cqrs/es/java/rmu/ResyncWorker.class'
          unzip -l rmu/build/distributions/rmu-lambda.zip | grep -F 'lib/aws-lambda-java-events'
      - name: Report Lambda package size
        run: deploy/report-lambda-package-size.sh rmu/build/distributions/rmu-lambda.zip
  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    strategy:
      matrix:
        java: [ 17 ] # LTS versions + latest version
    name: "Run tests with JDK ${{ matrix.java }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: test --info
  e2e:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: |
          docker buildx create --name amd-arm --driver docker-container --platform linux/amd64
          cd ./tools/e2e-test && make build && cd ../../
          ./tools/scripts/docker-build.sh
          ./tools/scripts/docker-compose-e2e-test.sh