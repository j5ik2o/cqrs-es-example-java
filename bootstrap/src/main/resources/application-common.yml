server:
  port: 48080

spring:
  graphql:
    graphiql:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test
    username: sa
    password:
logging:
  level:
    root: info
app:
  dynamo-db:
    region: ap-northeast-1
    endpoint-url: http://localhost:8000
    access-key: x
    secret-access-key: x
  persistence:
    journal-table-name: journal
    snapshot-table-name: snapshot
    head-table-name: head
    snapshot-aid-index-name: snapshot-aid-index
    snapshot-interval: 10
  stream:
    head-table-name: head
    journal-table-name: journal
    max-item-count: 32
    max-events-per-transaction: 1
    retry-max-attempts: 5
    retry-max-elapsed-millis: 30000
    retry-initial-delay-millis: 200
    retry-max-delay-millis: 5000
    poll-backoff-initial-millis: 500
    poll-backoff-max-millis: 30000
