server:
  port: 48080

spring:
  # mybatis-spring-boot-starter 4.1.0 pulls spring-boot-jdbc 4.1.0, which registers the
  # same DataSourcePoolMetadataProvidersConfiguration bean as Spring Boot 3.5.16.
  # Remove this once the dependency alignment in #587 lands.
  main:
    allow-bean-definition-overriding: true
  graphql:
    graphiql:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test
    username: sa
    password:
logging:
  level:
    root: info
app:
  dynamo-db:
    region: ap-northeast-1
    endpoint-url: http://localhost:8000
    access-key: x
    secret-access-key: x
  persistence:
    journal-table-name: journal
    snapshot-table-name: snapshot
    head-table-name: head
    snapshot-aid-index-name: snapshot-aid-index
    snapshot-interval: 10
  stream:
    head-table-name: head
    journal-table-name: journal
    max-item-count: 32
